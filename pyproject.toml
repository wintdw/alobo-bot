[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alobo-bot"
version = "0.1.0"
description = "Read-only AloBooking (datlich.alobo.vn) helper: find the cheapest pickleball court for a place and time window via the public API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
alobo-bot = "alobo_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
